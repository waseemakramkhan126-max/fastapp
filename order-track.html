<!doctype html>
<html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14508c"><title>Track Order | Faster</title><link rel="stylesheet" href="customer-order.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark">F</span><div><strong>FASTER</strong><small>HOME DELIVERY</small></div></div><a class="top-link" href="customer-order.html">New Order</a></header>
<main class="shell"><section class="intro"><span class="eyebrow">ORDER TRACKING</span><h1>Apne order ka status dekhein</h1><p>Order ID aur wahi mobile number enter karein jo order dete waqt diya tha.</p></section>
<section class="panel"><form id="trackForm"><label class="field"><span>Order ID *</span><input id="orderId" required inputmode="numeric" placeholder="Misal: 1234"></label><label class="field"><span>Mobile number *</span><input id="phone" required inputmode="tel" placeholder="03XXXXXXXXX"></label><button id="trackBtn" class="primary">Status Check Karein →</button><div id="trackMessage" class="message" role="status" aria-live="polite"></div></form></section>
<section id="result" class="panel" hidden style="margin-top:16px"><div class="section-heading"><span class="step">✓</span><div><h2>Order details</h2><p id="resultId"></p></div></div><div class="order-number" id="statusText">—</div><p id="updatedText" class="hint"></p><div id="extraInfo" class="hint"></div><a href="customer-order.html" class="primary link-button">Naya Order Place Karein →</a></section><footer>© Faster Home Delivery</footer></main><script src="order-track.js"></script></body></html>
